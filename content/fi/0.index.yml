title: "Kaunista [Dokumentaatiota]{.text-primary}"
description: Luo nopeita, laajennettavia ja SEO-optimoituja julkaisuja kauniilla ulkosasulla.
seo:
  title: Kaannos
  description: Luo nopeita, laajennettavia ja SEO-optimoituja julkaisuja kauniilla ulkosasulla.
navigation: false
hero:
  links:
    - label: Aloitetaan
      icon: i-lucide-arrow-right
      trailing: true
      variant: soft
      to: /fi/docs/getting-started/installation
      size: xl
    - label: Lue Blogeja
      icon: i-lucide-book-open
      size: xl
      color: neutral
      variant: subtle
      to: /fi/blog
sections:
  - title: Käytössä Nuxt UI-komponentit
    description: Valitse haluamasi koko Nuxt UI-komponentttikirjastosta 100+ kauniisti tyylitellyistä muokattavista Vue-komponenteista.
    id: features
    orientation: horizontal
    features:
      - name: 100+ UI-komponenttia
        description: Painikkeista modaaleihin ja taulukoihin. Tailwind CSS käytössä automaattisesti.
        icon: i-lucide-package
      - name: Kirjautumiset
        description: Sisäänkirjaus ja rekisteröinti Studio-moduulin kautta.
        icon: i-lucide-shield
      - name: TypeScript
        description: Täysi TypeScript-tuki tyyppeineen kaikissa komponenteissa.
        icon: i-lucide-code-2
  - title: Nykyaikainen kehitys
    description: Kaikki mitä sovelluskehityksessä tarvitaan. Erilaisista sivuista kojelautoihin, valinnanvaraa riittää.
    orientation: horizontal
    reverse: true
    features:
      - name: Tehokkuus
        description: Optimoitu Core Web Vitals:n automaattisella koodinjaolla, laiskalla lataamisella, sekä SSR/SSG-tuella.
        icon: i-lucide-zap
      - name: Teemat
        description: Teemojen vaihto väreineen, kuvakkeineen ja fontteineen.
        icon: i-lucide-palette
      - name: Monikielisyys
        description: i18n-tuki RTL/LTR-suunnille sisältäen @nuxt/fonts-integraatiot. Suomeksi ja Englanniksi.
        icon: i-lucide-globe
features:
  title: Kaikkia tarpeellista
  description: Ei tarvetta aloittaa tyhjästä. Luo ominaisuuksia ja ohjelmisto hoitaa loput.
  items:
    - title: Kaunis ulkoasu
      description: Semanttiset väri-aliakset, suunnittelumerkit ja Tailwind Variantit tyylittelyyn.
      icon: i-lucide-palette
    - title: Saavutettavuus ensin
      description: Pohjautuu Reka UI-kirjastoon varmistaen saavutettavuuden kriteerit. WCAG-yhteensopivat komponentit toimivat kaikkialla.
      icon: i-lucide-accessibility
    - title: Kehityskokemus
      description: Automaattiset tuonnit, moduulipäivitykset ja laaja dokumentaatio.
      icon: i-lucide-terminal
    - title: SEO-optimoinnit
      description: Palvelinpuolen renderöinti, automaattinen meta, sitemapit, sekä Open Graph-kuvat.
      icon: i-lucide-search
    - title: Tuotantovalmis
      description: Virheet, tilat, varmistukset sekä parhaat turvaratkaisut kaikissa komponenteissa.
      icon: i-lucide-check-circle
    - title: Muokattavissa
      description: Ohita mikä tahansa tyyli ui-asetuksella, muokkaa AppConfig:a tai suoraan Tailwind-luokkia.
      icon: i-lucide-settings
testimonials:
  headline: Kehittäjille ja kirjoittajille
  title: Ole osana muutosta
  description: Miksi valita Kaannos muiden joukosta? Mallit englanniksi, ei aitoja.
  items:
    - quote: Kaannos transformed how we build. The component quality is exceptional - everything just works with perfect TypeScript support, accessibility, and dark mode built in.
      user:
        name: Sarah Chen
        description: CTO at TechScale Solutions
        avatar:
          src: /cat.png
    - quote: We shipped our MVP in 2 weeks instead of 2 months. The authentication flows and form components saved us countless hours of development time.
      user:
        name: Marcus Rodriguez
        description: VP of Engineering at DataFlow
        avatar:
          src: /catbirchdark.webp
    - quote: The design system with AppConfig is brilliant. We maintain brand consistency across all our products while leveraging the full component library.
      user:
        name: David Kumar
        description: Security Director at SecureStack
        avatar:
          src: /catbirch.webp
    - quote: Perfect Lighthouse scores out of the box. Our Core Web Vitals improved dramatically just by switching to Kaannos components.
      user:
        name: Emily Zhang
        description: Lead Architect at ScaleForce
        avatar:
          src: /logo-dark.webp
    - quote: The Tailwind Variants system makes customization so intuitive. We can override any component style while keeping the functionality intact.
      user:
        name: James Wilson
        description: DevOps Lead at CloudPro
        avatar:
          src: /logo-light.webp
    - quote: From the SaaS template to production in days. The pre-built layouts, navigation, and content structure accelerated our launch.
      user:
        name: Lisa Patel
        description: CEO at AutoScale
        avatar:
          src: /cat.png
    - quote: Reka UI foundation means accessibility is never an afterthought. We achieved WCAG compliance without any custom work.
      user:
        name: Michael Torres
        description: Frontend Lead at AccessFirst
        avatar:
          src: /catbirchdark.webp
    - quote: The documentation is outstanding. Every component has clear examples, and the community on Discord is incredibly helpful.
      user:
        name: Rachel Kim
        description: Performance Engineer at APIHub
        avatar:
          src: /catbirch.webp
    - quote: We replaced three different UI libraries with Kaannos. The consistency and quality across all components is unmatched.
      user:
        name: Thomas Weber
        description: UI Architecture Lead at DesignScale
        avatar:
          src: /logo-dark.webp
    - quote: The integration with Nuxt modules is seamless. Color mode, fonts, icons - everything works together perfectly.
      user:
        name: Sophia Martinez
        description: Integration Specialist at TechFlow
        avatar:
          src: /logo-light.webp
cta:
  title: Valmiina luomaan jotain uutta?
  description: Liity kehittämään Kaannosta. Avointa ja vapaata!
  links:
    - label: Aloita tekemään
      to: '/fi/docs/getting-started/installation'
      trailingIcon: i-lucide-arrow-right
      variant: soft
    - label: Lue Blogeja
      to: '/fi/blog'
      variant: subtle
      icon: i-lucide-book-open
