faq:
  title: Kysymyksiä
  description: Tärkeimpiä ja oleellisimpia tietoja.
  items:
    - label: Tietoturvallisuus toimii?
      content: Mikään ei ole täysin varmaa, mutta tuoreimmassa teknologiassa on suurin osa ratkaisuista sisäänrakennettuna.
    - label: Kuinka peruminen tapahtuu?
      content: Viestittelemällä, kaikesta voidaan sopia.
    - label: Mitä ilmaista on tarjolla?
      content: Lähes kaikki on avointa lähdekoodia. Tietokantojen ylläpito, varmistus ja päivitys on työläin osuus.
    - label: Kryptomaailma?
      content: Hajautettu tietokanta vahvoilla avaimilla ja eri tarkoituksiin luodut sovellukset tarjoavat melkoiset mahdollisuudet.
    - label: Mitkä moraalit?
      content: Rahan keinotekoinen niukkuus aiheuttaa ongelmia ja pitää yllä valtarakenteita, vaikka pohjalla on vain tyhjiä lupauksia.
    - label: Saako opastusta?
      content: Auttaminen on tärkeää ja aina kannattaa kysyä, jos on epäselvyyksiä. Kysyvä ei tieltä eksy!
