about:
  title: Minusta
  description: |
    Koodausta vuosikymmenien harrastuspohjalta ja päivittäistä tiedon ahmimista, sekä itsensä tutkimista. 
    Seikkailumieltä ja vapauden kaihoa unohtamatta.
    Sovellusten kehittäminen on kivaa ja vielä parempi, jos siitä on muillekin hyötyä. 
    Moraaliset päätökset ovat korkealla arvoasteikossa.
