faq:
  title: UKK
  description: Useimmin kysyttyjä kysymyksiä.
  categories:
    - title: Palvelut
      questions:
        - label: Mitä osaat?
          content: |
            Keskittynyt nettikehittelyyn, ulkoasuista lähtien. Tietotaitoa riittää ruoantuotannosta kryptovaluuttoihin pitkältä ajanjaksolta. Villityksenä Vue.js/Nuxt.js, tavoitteena tehdä mahdollisimman monipuolisia ohjelmistoja.
        - label: Kuinka menettelet?
          content: |
            Paljon kommunikointia ja suunnittelua, joskus yrityksen ja erehdyksen kautta. Käyttökokemus on tärkeä osa-alue, tarpeiden tyydyttämisen lisäksi.
        - label: Kenen kanssa toimit?
          content: |
            Oikeasti yhteistä hyvää tuottavat yhteisöt ja projektit, joissa ei ole turhaa byrokratiaa. Eurojen ulkopuolella toimiminen toivottavaa, kryptojen käyttäminen suositeltavaa.
    - title: Korvaus ja aikataulu
      questions:
        - label: Mitä projekti yleensä kustantaa?
          content: |
            Riippuen tarkoitusperästä. Oikean avoimen lähdekoodin ratkaisut ovat ilmaisia, aivojen ja tietotaitojen käytöstä mielellään saisi korvauksen. Kustannus kasvaa projektin koon mukaan, firmoille lähtien 0,04BTC, laajemmista 0,07BTC:stä 0,25BTC:n. Konsultaatiota 0,007BTC/pv.
        - label: Kuinka korvaus toteutetaan?
          content: |
            Yleensä 40% etumaksua ja loput 60% valmistuessa. Kryptovaluutat käy.
        - label: Kauanko kestää?
          content: |
            Aikataulu riippuu projektin koosta ja monimutkaisuudesta. Pienemmät hoituu yleensä kuukauden sisällä, suuremmissa voi mennä 2-4kk. Aikataulutus hahmottuu suunnitelman perkaamisen mukaan.
        - label: Minkälaista tukea on tarjolla?
          content: |
            Neuvonta ja opastus kuuluu pakettiin, oli se ulkoasu, lisätoiminnot tai perus ylläpito. Kaikesta voi neuvotella.
    - title: Minusta
      questions:
        - label: Mistä tykkäät?
          content: |
            Ongelmanratkaisua käyttämällä päivittäin koppa pysyy kasassa ja virkeänä. Uusimpia koodivillityksiä seuraamalla inspiraatio kasvaa ja ravinteikasta ruokaa nauttimalla auringonvalon lomassa kroppakin pysyy kunnossa.
        - label: Mitä harrastuksia?
          content: |
            Ympäriinsä kävely, kulkukissojen valokuvaus, tiedon ahmiminen ruudulta ja korvien kautta. Entinen seikkailija ja yhteisöjen jokapaikan höylä.
